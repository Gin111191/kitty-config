# Kitty — matching the look of ~/.config/wezterm/wezterm.lua as closely as kitty allows.
# The old auto-generated kitty.conf (3299 lines, fully commented, nothing actually set) is
# replaced here — every line below is a deliberate choice, not a default left in place.
#
# Reload: kitty watches this file and applies changes on save.
# Colour files: dark-theme.conf / light-theme.conf, so they can be swapped without touching this
# file — same split WezTerm uses between wezterm.lua and theme.lua.

# ── Font ──────────────────────────────────────────────────────────────────────
# "...Mono" variant specifically: kitty is strict about icon glyph width, and the Nerd Font
# patcher ships a Mono variant made for exactly this (WezTerm is lenient enough to not need it).
font_family      JetBrainsMono Nerd Font Mono
font_size        13.0
# Percent is of the ORIGINAL height: 110% = +10% (WezTerm's line_height 1.1). "10%" would crush
# every row to a tenth of its height.
modify_font cell_height 110%

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor_shape            beam
cursor_beam_thickness   1.5
cursor_blink_interval   0.65
cursor_stop_blinking_after 0

# ── Scrollback ────────────────────────────────────────────────────────────────
# Same reasoning as WezTerm: default (2000) is nowhere near enough for a long agent run.
scrollback_lines 100000

# ── Window ────────────────────────────────────────────────────────────────────
initial_window_width   140c
initial_window_height  40c
window_padding_width    8 12 8 12
hide_window_decorations no

# Slightly see-through with the desktop blurred behind it — same values as WezTerm's
# window_background_opacity/macos_window_background_blur.
background_opacity      0.94
dynamic_background_opacity yes
background_blur         26

# ── Tab bar ───────────────────────────────────────────────────────────────────
tab_bar_edge     top
tab_bar_min_tabs 1
tab_bar_style    fade
tab_title_max_length 28

# ── Quiet ─────────────────────────────────────────────────────────────────────
enable_audio_bell no
confirm_os_window_close 1

# ── Environment ───────────────────────────────────────────────────────────────
# Started from a shell inside tmux (typing `kitty` in a WezTerm pane), kitty would pass that
# outer tmux's variables to its own shells. Programs then believe they run inside tmux:
# snacks.image wraps every image for a tmux that isn't there, and nothing is drawn.
# A tmux started inside kitty sets these again for its own panes, so removing them is safe.
env TMUX
env TMUX_PANE
env TERM_PROGRAM
env TERM_PROGRAM_VERSION

# ── Colours ───────────────────────────────────────────────────────────────────
# Kitty has no OS-appearance auto-switch like WezTerm's `window-config-reloaded` hook, so this
# starts on the dark scheme and CMD+OPT+arrows swap the file live (no restart) via `set_colors`.
include dark-theme.conf

# ── Keys ──────────────────────────────────────────────────────────────────────
map cmd+alt+down set_colors --all --configured /Users/gin/.config/kitty/dark-theme.conf
map cmd+alt+up   set_colors --all --configured /Users/gin/.config/kitty/light-theme.conf

# Ported from ~/.config/wezterm/wezterm.lua's "Dusk-Navy" scheme (itself from a Terminal.app
# profile). Colour values copied 1:1. color8 (bright black) is lifted to #93a1b3 instead of the
# scheme's own #3D4A6B — same reason as WezTerm's BRIGHT_BLACK.dark: secondary rows (line numbers,
# tool summaries) that agents print in ANSI slot 8 are unreadable at the scheme's own value.

foreground            #EDEEF7
background            #1d2837
cursor                #A9AFC6
cursor_text_color     #1d2837
selection_foreground  #EDEEF7
selection_background  #3D4A6B

macos_titlebar_color  #1d2837

# black, red, green, yellow, blue, magenta, cyan, white
color0  #1A1D26
color1  #B4637A
color2  #6E9E8A
color3  #C9A227
color4  #5C7CB8
color5  #8B7BB8
color6  #6E9AB8
color7  #A9AFC6

# bright variants
color8  #93a1b3
color9  #D18A9E
color10 #8FBFA9
color11 #E0C05A
color12 #7D9BD4
color13 #A99AD4
color14 #8FBBD4
color15 #EDEEF7
